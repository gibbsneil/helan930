<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeFlow | Visual Development Platform</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Roboto', sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f9fbfd;
        }
        
        h1, h2, h3, h4 {
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            line-height: 1.3;
        }
        
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        /* Header & Navigation */
        header {
            background-color: #fff;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.05);
            position: fixed;
            width: 100%;
            z-index: 1000;
        }
        
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
        }
        
        .logo {
            display: flex;
            align-items: center;
        }
        
        .logo-icon {
            color: #4361ee;
            font-size: 28px;
            margin-right: 10px;
        }
        
        .logo-text {
            font-family: 'Poppins', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: #333;
        }
        
        .logo-text span {
            color: #4361ee;
        }
        
        .nav-links {
            display: flex;
            list-style: none;
        }
        
        .nav-links li {
            margin-left: 30px;
        }
        
        .nav-links a {
            text-decoration: none;
            color: #555;
            font-weight: 500;
            transition: color 0.3s;
        }
        
        .nav-links a:hover {
            color: #4361ee;
        }
        
        .cta-button {
            background-color: #4361ee;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }
        
        .cta-button:hover {
            background-color: #3a56d4;
            transform: translateY(-2px);
        }
        
        /* Hero Section */
        .hero {
            padding: 150px 0 100px;
            background: linear-gradient(135deg, #f0f4ff 0%, #f9fbfd 100%);
        }
        
        .hero-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
        }
        
        .hero-text {
            flex: 1;
        }
        
        .hero-text h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #222;
        }
        
        .hero-text h1 span {
            color: #4361ee;
        }
        
        .hero-text p {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
            max-width: 600px;
        }
        
        .hero-buttons {
            display: flex;
            gap: 15px;
        }
        
        .secondary-button {
            background-color: white;
            color: #4361ee;
            border: 2px solid #4361ee;
            padding: 12px 28px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .secondary-button:hover {
            background-color: #f0f4ff;
        }
        
        .hero-image {
            flex: 1;
            text-align: center;
        }
        
        .hero-image i {
            font-size: 280px;
            color: #4361ee;
            filter: drop-shadow(0 20px 40px rgba(67, 97, 238, 0.2));
        }
        
        /* Features Section */
        .features {
            padding: 100px 0;
            background-color: white;
        }
        
        .section-title {
            text-align: center;
            margin-bottom: 60px;
        }
        
        .section-title h2 {
            font-size: 36px;
            color: #222;
            margin-bottom: 15px;
        }
        
        .section-title p {
            color: #666;
            max-width: 700px;
            margin: 0 auto;
        }
        
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
        }
        
        .feature-card {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .feature-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
        }
        
        .feature-icon {
            background-color: #eef2ff;
            color: #4361ee;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            font-size: 28px;
        }
        
        .feature-card h3 {
            font-size: 22px;
            margin-bottom: 15px;
        }
        
        .feature-card p {
            color: #666;
        }
        
        /* Benefits Section */
        .benefits {
            padding: 100px 0;
            background-color: #f0f4ff;
        }
        
        .benefits-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
        }
        
        .benefit-item {
            text-align: center;
            padding: 30px 20px;
        }
        
        .benefit-icon {
            color: #4361ee;
            font-size: 40px;
            margin-bottom: 20px;
        }
        
        .benefit-item h3 {
            font-size: 22px;
            margin-bottom: 15px;
        }
        
        .benefit-item p {
            color: #666;
        }
        
        /* Testimonials */
        .testimonials {
            padding: 100px 0;
            background-color: white;
        }
        
        .testimonial-slider {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .testimonial {
            background: #f9fbfd;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }
        
        .testimonial-text {
            font-size: 18px;
            font-style: italic;
            margin-bottom: 30px;
            color: #555;
        }
        
        .testimonial-author {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .author-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #4361ee;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 24px;
        }
        
        .author-info h4 {
            font-size: 18px;
            margin-bottom: 5px;
            text-align: left;
        }
        
        .author-info p {
            color: #777;
            font-size: 14px;
        }

        /* Footer */
        footer {
            background-color: #222;
            color: #fff;
            padding: 40px 0;
            text-align: center;
            font-size: 14px;
        }
        
        footer p {
            color: #aaa;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .hero-content {
                flex-direction: column;
                text-align: center;
            }
            .hero-text h1 {
                font-size: 36px;
            }
            .hero-buttons {
                justify-content: center;
            }
            .nav-links {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- Header & Navigation -->
    <header>
        <div class="container">
            <nav>
                <div class="logo">
                    <i class="fa-solid fa-cubes logo-icon"></i>
                    <div class="logo-text">Code<span>Flow</span></div>
                </div>
                <ul class="nav-links">
                    <li><a href="#features">特性</a></li>
                    <li><a href="#benefits">优势</a></li>
                    <li><a href="#testimonials">评价</a></li>
                </ul>
                <button class="cta-button">免费开始</button>
            </nav>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="container">
            <div class="hero-content">
                <div class="hero-text">
                    <h1>可视化开发，<span>效率提升 10 倍</span></h1>
                    <p>CodeFlow 是一款新一代可视化开发平台。通过拖拽组件、配置流程，无需编写繁琐的样板代码，即可快速构建和部署高性能的应用程序。</p>
                    <div class="hero-buttons">
                        <button class="cta-button">立即体验</button>
                        <button class="secondary-button">查看文档</button>
                    </div>
                </div>
                <div class="hero-image">
